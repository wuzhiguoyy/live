<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>道玄微数 · 直播频道</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0b1218; color:#e6edf3; font-family:'Microsoft YaHei',system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(11,18,24,.94); backdrop-filter:blur(8px); border-bottom:1px solid rgba(255,255,255,.08); padding:14px 18px; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; max-width:1200px; margin:0 auto; }
  .brand { font-size:16px; font-weight:600; }
  .brand small { color:#7d93a5; font-weight:400; margin-left:8px; font-size:12px; }
  input, select { background:#0f1a24; color:#e6edf3; border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:8px 12px; font-size:13px; outline:none; }
  input { flex:1; min-width:180px; }
  main { max-width:1200px; margin:0 auto; padding:18px; }
  .group { margin:22px 0 8px; color:#8fb3cc; font-size:13px; }
  .grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); }
  a.ch { display:flex; gap:10px; align-items:center; padding:10px; border-radius:10px; text-decoration:none; color:#e6edf3; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08); transition:.15s; }
  a.ch:hover { border-color:#2f81f7; background:rgba(47,129,247,.12); }
  a.ch img { width:44px; height:30px; object-fit:contain; background:#0b1218; border-radius:4px; flex:none; }
  a.ch span { font-size:13px; line-height:1.4; overflow:hidden; }
  .empty, .err { color:#8aa0b0; font-size:14px; padding:40px 0; text-align:center; }
  footer { text-align:center; color:#6e8494; font-size:12px; padding:30px 18px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">道玄微数 · 直播频道<small>TV</small></div>
    <input id="q" placeholder="搜索频道，如 CCTV、凤凰、湖南">
    <input id="proxy" placeholder="m3u8 代理地址（可选，解决跨域）" style="min-width:260px">
    <select id="g"><option value="">全部分类</option></select>
    <a href="../index.html" style="color:#8fb3cc;font-size:13px;text-decoration:none">返回首页</a>
  </div>
</header>
<main>
  <div id="list"></div>
</main>
<footer>道玄微数科技信息有限公司</footer>
<script>
(function () {
  var cfg = { group: '', keyword: '' };
  var all = [];

  function logoName(url) {
    if (!url) return '';
    var name = url.split('/').pop().split('?')[0];
    return decodeURIComponent(name);
  }

  function parse(text) {
    var lines = text.split(/\r?\n/);
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line.indexOf('#EXTINF:') !== 0) continue;
      var nameMatch = line.match(/,(.*)$/);
      var name = nameMatch ? nameMatch[1].trim() : '';
      var logo = (line.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
      var group = (line.match(/group-title="([^"]*)"/) || [])[1] || '其他';
      var url = (lines[i + 1] || '').trim();
      if (!url || url.indexOf('#') === 0) continue;
      out.push({ name: name, logo: logoName(logo), group: group, url: url });
    }
    return out;
  }

  var proxy = localStorage.getItem('dx_proxy') || '';
  var proxyInput = document.getElementById('proxy');
  proxyInput.value = proxy;
  proxyInput.addEventListener('change', function (event) {
    proxy = event.target.value.trim();
    localStorage.setItem('dx_proxy', proxy);
    render();
  });

  function playUrl(url) {
    var finalUrl = proxy ? proxy.replace(/\/$/, '') + '/?url=' + encodeURIComponent(url) : url;
    return '../player/hls.html?vurl=' + encodeURIComponent(finalUrl);
  }

  function render() {
    var host = document.getElementById('list');
    var list = all.filter(function (item) {
      if (cfg.group && item.group !== cfg.group) return false;
      if (cfg.keyword && item.name.toLowerCase().indexOf(cfg.keyword) === -1) return false;
      return true;
    });

    if (!list.length) {
      host.innerHTML = '<div class="empty">没有匹配的频道</div>';
      return;
    }

    var groups = {};
    list.forEach(function (item) {
      (groups[item.group] = groups[item.group] || []).push(item);
    });

    var html = '';
    Object.keys(groups).forEach(function (name) {
      html += '<div class="group">' + name + '（' + groups[name].length + '）</div><div class="grid">';
      groups[name].forEach(function (item) {
        var play = playUrl(item.url);
        var logo = item.logo ? './' + encodeURIComponent(item.logo) : '';
        html += '<a class="ch" href="' + play + '" target="_blank" rel="noopener">'
          + (logo ? '<img loading="lazy" src="' + logo + '" onerror="this.style.display=\'none\'">' : '')
          + '<span>' + item.name + '</span></a>';
      });
      html += '</div>';
    });
    host.innerHTML = html;
  }

  fetch('./m3u/index.m3u', { cache: 'no-store' })
    .then(function (res) { return res.text(); })
    .then(function (text) {
      all = parse(text);
      var select = document.getElementById('g');
      var groups = [];
      all.forEach(function (item) { if (groups.indexOf(item.group) === -1) groups.push(item.group); });
      groups.forEach(function (name) {
        var option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      });
      render();
    })
    .catch(function () {
      document.getElementById('list').innerHTML = '<div class="err">频道列表加载失败，请检查 ./m3u/index.m3u 是否存在</div>';
    });

  document.getElementById('q').addEventListener('input', function (event) {
    cfg.keyword = event.target.value.trim().toLowerCase();
    render();
  });
  document.getElementById('g').addEventListener('change', function (event) {
    cfg.group = event.target.value;
    render();
  });
})();
</script>
</body>
</html>
